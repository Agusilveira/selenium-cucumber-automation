cucumber.glue=steps,hooks
cucumber.plugin=pretty, html:target/cucumber-report.html, summary
cucumber.publish.quiet=true

cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
# Sin max-pool-size, ForkJoinPool crea hilos de compensacion cuando los que
# tiene se bloquean. Selenium es I/O bloqueante de punta a punta, asi que el
# limite de 4 se ignora y termina levantando un navegador por escenario.
cucumber.execution.parallel.config.fixed.max-pool-size=4
