name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Correr los tests
        env:
          TEST_ENV: ci
          BROWSER: ${{ matrix.browser }}
          SAUCE_USER: ${{ secrets.SAUCE_USER || 'standard_user' }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
        # Los runners tienen menos nucleos que una maquina de desarrollo, asi que
        # se baja el paralelismo. Ambas claves: parallelism sola no alcanza,
        # ForkJoinPool crea hilos de compensacion para los bloqueados en I/O.
        run: >
          mvn -B test
          -Dcucumber.execution.parallel.config.fixed.parallelism=2
          -Dcucumber.execution.parallel.config.fixed.max-pool-size=2

      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: |
            target/cucumber-report.html
            target/screenshots
          retention-days: 30

  publicar-reporte:
    needs: e2e
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el reporte de Chrome
        uses: actions/download-artifact@v4
        with:
          name: cucumber-report-chrome
          path: site

      - name: Renombrar a index.html
        run: mv site/cucumber-report.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
